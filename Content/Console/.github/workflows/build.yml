name: Build master

on:
  push:
    branches:
      - MyReleaseBranch
    paths-ignore:
      - "*.md"

  pull_request:
    branches:
      - MyReleaseBranch
    paths-ignore:
      - "*.md"

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Build
        if: runner.os != 'Windows'
        run: |
          dotnet --info
          echo "$PATH"
          chmod +x ./build.sh
          ./build.sh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Build
        if: runner.os == 'Windows'
        run: |
          dotnet --info
          ./build.cmd
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (${{ matrix.os }}-${{ matrix.configuration }})
          path: '**/TestResults/testResults*.trx'
          reporter: dotnet-trx
  # Builds the project in a dev container
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Build and run dev container task
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            chmod +x ./build.sh
            ./build.sh
