name: Build master

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  integration-tests:
    name: integration-tests (${{ matrix.configuration }}, ${{ matrix.target.os }}, ${{ matrix.target.partition }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, partition: generated-builds }
          - { os: ubuntu-latest, partition: other }
          - { os: windows-latest, partition: generated-builds }
          - { os: windows-latest, partition: other }
          - { os: macOS-latest, partition: other }
          - { os: macOS-latest, partition: generated-library }
          - { os: macOS-latest, partition: generated-console }
          - { os: macOS-latest, partition: sample-contracts }
        configuration: [Debug, Release]
    runs-on: ${{ matrix.target.os == 'macOS-latest' && 'macos-15-intel' || matrix.target.os }}
    env:
      MINISCAFFOLD_TEST_PARTITION: ${{ matrix.target.partition }}
      MINISCAFFOLD_TEST_OS: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v5
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Build via Bash
        if: runner.os != 'Windows'
        run: |
          chmod +x ./build.sh
          ./build.sh IntegrationTests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Build via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd IntegrationTests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Upload partition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partition-${{ matrix.target.os }}-${{ matrix.configuration }}-${{ matrix.target.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/partitions/${{ matrix.target.partition }}/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.target.os }}-${{ matrix.configuration }}-${{ matrix.target.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/TestResults/**/*.trx
            TestResults/generated-builds/**
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build (${{ matrix.configuration }}, ${{ matrix.os }})
    needs: integration-tests
    if: always()
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test partition verifier
        shell: pwsh
        run: ./build/TestPartitions.Tests.ps1 -ResultsDirectory "${{ runner.temp }}/verifier-controls"
      - name: Upload verifier controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-controls-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier-controls/
          if-no-files-found: error
          retention-days: 7
      - name: Download partition evidence
        uses: actions/download-artifact@v4
        with:
          pattern: partition-${{ matrix.os }}-${{ matrix.configuration }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/partitions
      - name: Verify complete test coverage
        if: always()
        shell: pwsh
        env:
          WORKERS_RESULT: ${{ needs.integration-tests.result }}
          TEST_CONFIGURATION: ${{ matrix.configuration }}
          TEST_OS: ${{ matrix.os }}
          PARTITION_BUNDLES: ${{ runner.temp }}/partitions
        run: |
          ./build/TestPartitions.ps1 -Mode Verify -Configuration $env:TEST_CONFIGURATION -OperatingSystem $env:TEST_OS -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -SourceRevision $env:GITHUB_SHA -BundleRoot $env:PARTITION_BUNDLES -WorkersResult $env:WORKERS_RESULT
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.os }}-${{ matrix.configuration }})
          path: '${{ runner.temp }}/partitions/**/outer/outer.trx'
          reporter: dotnet-trx

  build-arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - name: Build package via Bash
        if: runner.os != 'Windows'
        run: ./build.sh DotnetPack
        env:
          CI: true
      - name: Build package via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd DotnetPack
        env:
          CI: true
      - name: Test ARM64 archives
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw 'Archive tests require an ARM64 runner' }
          $env:MINISCAFFOLD_NUPKG_LOCATION = (Get-ChildItem ./dist/MiniScaffold.*.nupkg).FullName
          dotnet test tests/MiniScaffold.Tests/MiniScaffold.Tests.fsproj --filter 'FullyQualifiedName~console archives' --logger 'trx;LogFilePrefix=testResults'
        env:
          CI: true
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ARM64 Test Results (${{ matrix.os }})
          path: '**/TestResults/testResults*.trx'
          reporter: dotnet-trx
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-arm64-${{ matrix.os }}
          path: |
            **/TestResults/**/*.trx
            TestResults/generated-builds/**
          if-no-files-found: warn
          retention-days: 7

  # Builds the project in a dev container
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v5

      - name: Build and run dev container task
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            chmod +x ./build.sh
            ./build.sh
