name: Build master

env:
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: "false"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  integration-tests:
    name: integration-tests (${{ matrix.configuration }}, ${{ matrix.target.os }}, ${{ matrix.target.partition }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, partition: generated-builds }
          - { os: ubuntu-latest, partition: other }
          - { os: windows-latest, partition: generated-builds }
          - { os: windows-latest, partition: other }
        configuration: [Debug, Release]
    runs-on: ${{ matrix.target.os }}
    env:
      MINISCAFFOLD_TEST_PARTITION: ${{ matrix.target.partition }}
      MINISCAFFOLD_TEST_OS: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@v5
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Build via Bash
        if: runner.os != 'Windows'
        run: |
          chmod +x ./build.sh
          ./build.sh IntegrationTests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Build via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd IntegrationTests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          CI: true
      - name: Upload partition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partition-${{ matrix.target.os }}-${{ matrix.configuration }}-${{ matrix.target.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/partitions/${{ matrix.target.partition }}/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.target.os }}-${{ matrix.configuration }}-${{ matrix.target.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/TestResults/**/*.trx
            TestResults/generated-builds/**
          if-no-files-found: warn
          retention-days: 7

  integration-macos:
    name: integration-macos (${{ matrix.recipe.id }})
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - id: other-debug-contracts
            first: { configuration: Debug, partition: other }
            second: { configuration: Debug, partition: sample-contracts }
            third: { configuration: '', partition: '' }
          - id: other-release-console
            first: { configuration: Release, partition: other }
            second: { configuration: Debug, partition: generated-console }
            third: { configuration: '', partition: '' }
          - id: library-release-b
            first: { configuration: Release, partition: generated-library-b }
            second: { configuration: Release, partition: generated-console }
            third: { configuration: Release, partition: sample-contracts }
          - id: library-a-debug-b
            first: { configuration: Release, partition: generated-library-a }
            second: { configuration: Debug, partition: generated-library-b }
            third: { configuration: Debug, partition: generated-library-a }
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - name: First workload
        id: first
        uses: ./.github/actions/integration-workload
        with:
          configuration: ${{ matrix.recipe.first.configuration }}
          partition: ${{ matrix.recipe.first.partition }}
      - name: Clean checkout for second workload
        id: second_checkout
        if: success() && matrix.recipe.second.configuration != '' && matrix.recipe.second.partition != '' && steps.first.outcome == 'success'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Second workload
        id: second
        if: success() && steps.second_checkout.outcome == 'success'
        uses: ./.github/actions/integration-workload
        with:
          configuration: ${{ matrix.recipe.second.configuration }}
          partition: ${{ matrix.recipe.second.partition }}
      - name: Clean checkout for third workload
        id: third_checkout
        if: success() && matrix.recipe.third.configuration != '' && matrix.recipe.third.partition != '' && steps.second.outcome == 'success'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: true
      - name: Third workload
        id: third
        if: success() && steps.third_checkout.outcome == 'success'
        uses: ./.github/actions/integration-workload
        with:
          configuration: ${{ matrix.recipe.third.configuration }}
          partition: ${{ matrix.recipe.third.partition }}

  verifier-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test partition verifier
        shell: pwsh
        run: ./build/TestPartitions.Tests.ps1 -ResultsDirectory "${{ runner.temp }}/verifier-controls"
      - name: Upload verifier controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier-controls/
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.configuration }}, ${{ matrix.os }})
    needs: [integration-tests, integration-macos, verifier-controls, build-arm64, build-arm64-macos]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download partition evidence
        uses: actions/download-artifact@v4
        with:
          pattern: partition-${{ matrix.os }}-${{ matrix.configuration }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/partitions
      - name: Verify complete test coverage
        if: always()
        shell: pwsh
        env:
          WORKERS_RESULT: ${{ needs.integration-tests.result == 'success' && needs.integration-macos.result == 'success' && needs.verifier-controls.result == 'success' && needs.build-arm64.result == 'success' && needs.build-arm64-macos.result == 'success' && 'success' || 'failure' }}
          TEST_CONFIGURATION: ${{ matrix.configuration }}
          TEST_OS: ${{ matrix.os }}
          PARTITION_BUNDLES: ${{ runner.temp }}/partitions
        run: |
          ./build/TestPartitions.ps1 -Mode Verify -Configuration $env:TEST_CONFIGURATION -OperatingSystem $env:TEST_OS -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -SourceRevision $env:GITHUB_SHA -BundleRoot $env:PARTITION_BUNDLES -WorkersResult $env:WORKERS_RESULT
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.os }}-${{ matrix.configuration }})
          path: '${{ runner.temp }}/partitions/**/outer/outer.trx'
          reporter: dotnet-trx

  build-arm64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - name: Build package via Bash
        if: runner.os != 'Windows'
        run: ./build.sh DotnetPack
        env:
          CI: true
      - name: Build package via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd DotnetPack
        env:
          CI: true
      - name: Test ARM64 archives
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw 'Archive tests require an ARM64 runner' }
          $env:MINISCAFFOLD_NUPKG_LOCATION = (Get-ChildItem ./dist/MiniScaffold.*.nupkg).FullName
          dotnet test tests/MiniScaffold.Tests/MiniScaffold.Tests.fsproj --filter 'FullyQualifiedName~console archives' --logger 'trx;LogFilePrefix=testResults'
        env:
          CI: true
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ARM64 Test Results (${{ matrix.os }})
          path: '**/TestResults/testResults*.trx'
          reporter: dotnet-trx
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-arm64-${{ matrix.os }}
          path: |
            **/TestResults/**/*.trx
            TestResults/generated-builds/**
          if-no-files-found: warn
          retention-days: 7

  build-arm64-macos:
    name: build-arm64 (macos-15)
    if: ${{ !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Setup necessary dotnet SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
      - name: Build package via Bash
        if: runner.os != 'Windows'
        run: ./build.sh DotnetPack
        env:
          CI: true
      - name: Build package via Windows
        if: runner.os == 'Windows'
        run: ./build.cmd DotnetPack
        env:
          CI: true
      - name: Test ARM64 archives
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw 'Archive tests require an ARM64 runner' }
          $env:MINISCAFFOLD_NUPKG_LOCATION = (Get-ChildItem ./dist/MiniScaffold.*.nupkg).FullName
          dotnet test tests/MiniScaffold.Tests/MiniScaffold.Tests.fsproj --filter 'FullyQualifiedName~console archives' --logger 'trx;LogFilePrefix=testResults'
        env:
          CI: true
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ARM64 Test Results (macos-15)
          path: '**/TestResults/testResults*.trx'
          reporter: dotnet-trx
      - name: Upload test diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-arm64-macos-15
          path: |
            **/TestResults/**/*.trx
            TestResults/generated-builds/**
          if-no-files-found: warn
          retention-days: 7

  # Builds the project in a dev container
  build-devcontainer:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v5

      - name: Build and run dev container task
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            export DOTNET_ADD_GLOBAL_TOOLS_TO_PATH=false
            chmod +x ./build.sh
            ./build.sh
